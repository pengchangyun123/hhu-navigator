<style>

map.on('rightclick',function(e){var lat=e.lnglat.lat.toFixed(6),lng=e.lnglat.lng.toFixed(6);var n=prompt('输入该地点名称：');if(!n)return;cc.push({name:n,lat:lat,lng:lng});var h=cc.map(function(c,i){return(i+1)+'. '+c.name+' — lng:'+c.lng+', lat:'+c.lat}).join('<br>');acm('bot','✅ 已采集 <b>'+n+'</b><br><code style="font-size:10px;">lng:'+lng+', lat:'+lat+'</code><br><br>📋 <b>已采集 '+cc.length+' 个：</b><br>'+h+'<br><button onclick="cpy()" style="padding:4px 12px;border:1.5px solid var(--ink);border-radius:20px;background:var(--paper-dark);cursor:pointer;font-size:12px;">📋 一键复制</button><button onclick="ccl()" style="padding:4px 12px;border:1.5px solid var(--ink);border-radius:20px;background:var(--paper-dark);cursor:pointer;font-size:12px;margin-left:4px;">🗑️ 清空</button>')});
function cpy(){var t=cc.map(function(c){return c.name+'：'+c.lat+', '+c.lng}).join('\n');navigator.clipboard.writeText(t).then(function(){acm('bot','📋 已复制！')})}
function ccl(){cc=[];acm('bot','🗑️ 已清空。')}

var bp=document.getElementById('btnPickStart');
bp.addEventListener('click',function(){S.pm=!S.pm;if(S.pm){bp.style.background='var(--accent)';bp.style.color='white';map.getContainer().style.cursor='crosshair';acm('bot','📌 请点击地图设置起点')}else{bp.style.background='';bp.style.color='';map.getContainer().style.cursor=''}});
map.on('click',function(e){if(!S.pm)return;sup(e.lnglat.lng,e.lnglat.lat);S.pm=false;bp.style.background='';bp.style.color='';map.getContainer().style.cursor='';acm('bot','📍 起点已设置（'+S.ulat.toFixed(6)+', '+S.ulng.toFixed(6)+'）')});

function sup(lng,lat){if(S.um)S.um.setMap(null);if(S.ac)S.ac.setMap(null);S.ulng=lng;S.ulat=lat;S.um=new AMap.Marker({position:[lng,lat],content:'<div class="user-marker-wrap"><div class="user-dot-outer"><div class="user-dot-inner"></div></div></div>',offset:new AMap.Pixel(-15,-15),zIndex:1000});S.um.setMap(map);S.ac=new AMap.Circle({center:[lng,lat],radius:5,strokeColor:'#4a7c96',strokeWeight:1,strokeOpacity:0.5,fillColor:'#4a7c96',fillOpacity:0.15,strokeStyle:'dashed',strokeDasharray:[3,4]});S.ac.setMap(map);map.setCenter([lng,lat])}

document.getElementById('btnDemo').addEventListener('click',function(){if(S.wid!==null){navigator.geolocation.clearWatch(S.wid);S.wid=null}sup(118.78935,31.91680);map.setZoom(17);acm('bot','🎓 已模拟定位至25舍附近')});

document.getElementById('btnGps').addEventListener('click',function(){if(!navigator.geolocation){acm('bot','⚠️ 浏览器不支持定位');return}if(S.wid!==null){if(S.ulat){map.setCenter([S.ulng,S.ulat]);acm('bot','📍 已移至当前位置')}return}S.sm={lat:null,lng:null,acc:999,cnt:0};S.wid=navigator.geolocation.watchPosition(function(pos){var gcj=wgs2gcj(pos.coords.longitude,pos.coords.latitude),lng=gcj[0],lat=gcj[1],acc=pos.coords.accuracy;if(S.sm.lat===null){S.sm.lat=lat;S.sm.lng=lng;S.sm.acc=acc;S.sm.cnt=1}else{if(acc>100&&S.sm.acc<50)return;var alpha=Math.max(0.3,Math.min(0.8,1-acc/100));S.sm.lat=alpha*lat+(1-alpha)*S.sm.lat;S.sm.lng=alpha*lng+(1-alpha)*S.sm.lng;S.sm.acc=acc;S.sm.cnt++}var clng=S.sm.lng+(S.cal?S.clng:0),clat=S.sm.lat+(S.cal?S.clat:0);if(!S.um){sup(clng,clat);map.setZoom(18);var s=acc<10?'精度极高':acc<30?'精度良好':acc<100?'精度一般':'精度较低';acm('bot','✅ 已定位（'+s+'，误差~'+Math.round(acc)+'米）')}else{S.ulng=clng;S.ulat=clat;S.um.setPosition([clng,clat]);S.ac.setCenter([clng,clat]);S.ac.setRadius(Math.max(5,acc));if(S.sm.cnt%20===0)acm('bot','📍 误差~'+Math.round(acc)+'米（'+S.sm.cnt+'点）')}},function(err){acm('bot','⚠️ 定位失败')},{enableHighAccuracy:true,maximumAge:1000,timeout:60000})});

document.getElementById('btnCalibrate').addEventListener('click',function(){if(!S.ulat){acm('bot','⚠️ 请先定位');return}var names=LOCS.map(function(l,i){return(i+1)+'. '+l.name}).join('\n');var choice=prompt('你当前站在哪个地点？输入编号或名称：\n\n'+names);if(!choice)return;var loc=null,num=parseInt(choice);if(num>=1&&num<=LOCS.length)loc=LOCS[num-1];else loc=LOCS.find(function(l){return l.name.indexOf(choice)>-1||choice.indexOf(l.name)>-1});if(!loc){acm('bot','⚠️ 未找到匹配地点');return}S.clng=loc.lng-S.ulng;S.clat=loc.lat-S.ulat;S.cal=true;S.ulng+=S.clng;S.ulat+=S.clat;if(S.um){S.um.setPosition([S.ulng,S.ulat]);S.ac.setCenter([S.ulng,S.ulat])}map.setCenter([S.ulng,S.ulat]);map.setZoom(18);acm('bot','🎯 已校准至 <b>'+loc.name+'</b>')});

function nav2(loc){if(!S.ulat){acm('bot','⚠️ 请先设置起点');return}cr();acm('bot','🔍 正在规划步行路线…');if(!S.wkLoaded){AMap.plugin('AMap.Walking',function(){S.wkLoaded=true;nav2(loc)});return}if(!S.wk)S.wk=new AMap.Walking({map:map});S.wk.search([S.ulng,S.ulat],[loc.lng,loc.lat],function(st,rs){console.log('Walking结果:',st,rs);if(st==='complete'&&rs.routes&&rs.routes.length>0){var r=rs.routes[0],dist=0,dur=0,sh='';if(r.steps){r.steps.forEach(function(s){dist+=s.distance||0;dur+=s.time||0});var ss=r.steps.slice(0,6);sh='<br>📋 路线指引：<br>';ss.forEach(function(s,i){var rd=s.road?' (<em>'+s.road+'</em>)':'';sh+=(i+1)+'. 🚶 '+s.instruction+rd+' — '+(s.distance||0)+'米<br>'});if(r.steps.length>6)sh+='…共'+r.steps.length+'步<br>'}S.nav=true;S.nt=loc;document.getElementById('navFrom').textContent='📍 起点';document.getElementById('navTo').textContent=loc.icon+' '+loc.name;var ds=dist<1000?dist+'米':(dist/1000).toFixed(1)+'公里';document.getElementById('navDistance').textContent='📏 '+ds;var wm=Math.ceil(dur/60);var ts=wm<1?'不到1分钟':wm<60?'约'+wm+'分钟':'约'+Math.floor(wm/60)+'小时'+(wm%60)+'分钟';document.getElementById('navTime').textContent='🚶 '+ts;document.getElementById('navInfoBar').style.display='flex';acm('bot',['✅ 路线已规划至 <strong>'+loc.name+'</strong>','📏 '+ds,'🚶 '+ts,'🛣️ 沿蓝色路线行走',sh].join('<br>'));hl(loc.id);map.setFitView()}else{acm('bot','⚠️ 路线规划失败')}})}
function cr(){if(S.wk)S.wk.clear();S.nav=false;S.nt=null;document.getElementById('navInfoBar').style.display='none';ch()}

function hl(id){ch();S.alid=id;var el=document.querySelector('[data-loc-id="'+id+'"]');if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'})}}
function ch(){S.alid=null;var items=document.querySelectorAll('.location-item.active');for(var i=0;i<items.length;i++)items[i].classList.remove('active')}
function sdl(loc){document.getElementById('popupIcon').textContent=loc.icon;document.getElementById('popupName').textContent=loc.name;document.getElementById('popupDesc').textContent=loc.desc;document.getElementById('detailPopup').style.display='flex';document.getElementById('popupGo').onclick=function(){cdp();nav2(loc)}}
function cdp(){document.getElementById('detailPopup').style.display='none'}

function rl(filter,search){filter=filter||'all';search=search||'';var list=document.getElementById('locationList'),fd=LOCS;if(filter!=='all')fd=fd.filter(function(l){return l.cat===filter});if(search){var q=search.toLowerCase();fd=fd.filter(function(l){return l.name.toLowerCase().indexOf(q)>-1||l.desc.toLowerCase().indexOf(q)>-1})}if(fd.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:#a89880;">没有找到匹配的地点 🧐</div>';return}list.innerHTML=fd.map(function(loc){return'<div class="location-item" data-loc-id="'+loc.id+'" onclick="hlc(\''+loc.id+'\')"><span class="loc-icon">'+loc.icon+'</span><div class="loc-info"><div class="loc-name">'+loc.name+'</div><div class="loc-cat">'+CM[loc.cat].name+'</div></div><button class="loc-nav-btn" onclick="event.stopPropagation();hnc(\''+loc.id+'\')">🧭 导航</button></div>'}).join('');if(S.alid){var el=document.querySelector('[data-loc-id="'+S.alid+'"]');if(el)el.classList.add('active')}}
function hlc(id){var loc=LOCS.find(function(l){return l.id===id});if(!loc)return;map.setCenter([loc.lng,loc.lat]);map.setZoom(18);hl(id)}
function hnc(id){var loc=LOCS.find(function(l){return l.id===id});if(!loc)return;nav2(loc)}

function acm(role,text){var c=document.getElementById('chatMessages'),d=document.createElement('div');d.className='msg '+role;d.innerHTML='<span class="msg-avatar">'+(role==='bot'?'🤖':'🧑')+'</span><div class="msg-bubble">'+text+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function haversine(lat1,lng1,lat2,lng2){var R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function bearing(lat1,lng1,lat2,lng2){var dLng=(lng2-lng1)*Math.PI/180,y=Math.sin(dLng)*Math.cos(lat2*Math.PI/180),x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLng);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function b2d(b){var d=['北','东北','东','东南','南','西南','西','西北'];return d[Math.round(b/45)%8]}

function fln(name){var clean=name.replace(/[的地点了吗在哪里去带我怎么走到达导航至]/g,'').trim();var f=LOCS.find(function(l){return l.name===clean});if(f)return f;f=LOCS.find(function(l){return l.name.indexOf(clean)>-1||clean.indexOf(l.name.replace(/[区东西南北（）\(\)]/g,''))>-1});if(f)return f;for(var i=0;i<LOCS.length;i++){var sn=LOCS[i].name.replace(/（.*）|\(.*\)|校区|江宁|学生/g,'');if(clean.indexOf(sn.substring(0,2))>-1||sn.indexOf(clean.substring(0,2))>-1)return LOCS[i]}return null}

function paq(input){if(!input)return;var q=input.trim();if(!q)return;acm('user',q);var isNav=/带我去|导航到|怎么去|怎么走|去往|到达|走到/.test(q),isWhere=/在哪里|在哪|位置|什么地方|怎么找/.test(q),isNearby=/附近|周边|最近|近一点|旁边的/.test(q),tl=null;if(isNav||isWhere){tl=fln(q);if(tl&&isNav){nav2(tl);return}if(tl&&isWhere){map.setCenter([tl.lng,tl.lat]);map.setZoom(18);hl(tl.id);acm('bot','📍 <strong>'+tl.name+'</strong><br>'+tl.desc);return}}if(q.indexOf('图书馆')>-1)tl=LOCS.find(function(l){return l.id==='lib-south'});else if(q.indexOf('体育馆')>-1)tl=LOCS.find(function(l){return l.id==='gym'});else if(q.indexOf('餐厅')>-1||q.indexOf('食堂')>-1||q.indexOf('吃')>-1)tl=LOCS.find(function(l){return l.id==='jiangjunshan'});else if(q.indexOf('校医院')>-1)tl=LOCS.find(function(l){return l.id==='hospital'});if(tl&&isNav){nav2(tl);return}if(tl){map.setCenter([tl.lng,tl.lat]);map.setZoom(18);hl(tl.id);acm('bot','📍 <strong>'+tl.name+'</strong><br>'+tl.desc);sdl(tl);return}if(isNearby){if(!S.ulat){acm('bot','⚠️ 请先设置起点');return}var nearby=LOCS.map(function(l){return Object.assign({},l,{distance:haversine(S.ulat,S.ulng,l.lat,l.lng)})}).sort(function(a,b){return a.distance-b.distance}).slice(0,5);var lines=nearby.map(function(l,i){var d=l.distance<1000?Math.round(l.distance)+'米':(l.distance/1000).toFixed(1)+'公里';return(i+1)+'. '+l.icon+' <strong>'+l.name+'</strong> — '+b2d(bearing(S.ulat,S.ulng,l.lat,l.lng))+' '+d});acm('bot','📍 最近的场所：<br><br>'+lines.join('<br>')+'<br><br>💡 说"带我去XX"开始导航');return}acm('bot','你可以这样问我：<br>• "带我去图书馆"<br>• "体育馆在哪里"<br>• "附近有什么"')}

document.getElementById('btnTogglePanel').addEventListener('click',function(){document.getElementById('sidePanel').classList.toggle('collapsed')});
document.getElementById('btnCancelNav').addEventListener('click',function(){cr();acm('bot','🛑 已取消导航')});
document.getElementById('btnSend').addEventListener('click',function(){var i=document.getElementById('chatInput');paq(i.value);i.value=''});
document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'){var i=document.getElementById('chatInput');paq(i.value);i.value=''}});
document.getElementById('agentToggle').addEventListener('click',function(){var p=document.getElementById('agentPanel');p.classList.toggle('collapsed');document.getElementById('agentToggleIcon').textContent=p.classList.contains('collapsed')?'+':'−'});
document.getElementById('popupClose').addEventListener('click',cdp);
document.getElementById('detailPopup').addEventListener('click',function(e){if(e.target===e.currentTarget)cdp()});
document.getElementById('searchInput').addEventListener('input',function(e){rl(S.acat,e.target.value)});
var chips=document.querySelectorAll('.cat-chip');for(var i=0;i<chips.length;i++){chips[i].addEventListener('click',function(){for(var j=0;j<chips.length;j++)chips[j].classList.remove('active');this.classList.add('active');S.acat=this.dataset.cat;document.getElementById('searchInput').value='';rl(S.acat);LOCS.forEach(function(loc){var m=S.mks[loc.id];if(m){S.acat==='all'||loc.cat===S.acat?m.show():m.hide()}})})}
var qbs=document.querySelectorAll('.quick-btn');for(var k=0;k<qbs.length;k++){qbs[k].addEventListener('click',function(){paq(this.dataset.cmd)})}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){cdp();cr()}});

rl();</script>
