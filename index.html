<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>河海大学江宁校区 · 手绘导航</title>
<style>
:root {
  --paper:#faf6ee;--paper-dark:#f0ead6;--ink:#3d322b;--ink-light:#6b5e53;
  --ink-faint:#a89880;--accent:#c75b39;--blue:#4a7c96;
  --shadow-rough:3px 3px 0px rgba(61,50,43,.15);
  --shadow-rough-sm:2px 2px 0px rgba(61,50,43,.12);
  --font-sketch:'STKaiti','KaiTi','楷体',serif;
  --font-body:'PingFang SC','Microsoft YaHei',sans-serif;
  --radius-rough:12px 8px 14px 6px;
  --radius-rough-sm:8px 5px 10px 4px;
  --radius-rough-lg:18px 12px 20px 10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-body);color:var(--ink);background:var(--paper)}

#map{width:100%;height:100%}

.coord-display{position:fixed;left:12px;bottom:30px;z-index:2000;background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius-rough-sm);padding:4px 10px;font-family:monospace;font-size:12px;color:var(--ink-light);box-shadow:var(--shadow-rough-sm);pointer-events:none}

.top-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2000;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--radius-rough-lg);box-shadow:var(--shadow-rough);padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-sketch)}
.brand-icon{font-size:24px}
.brand h1{font-size:18px;font-weight:400;color:var(--ink);font-family:var(--font-sketch);letter-spacing:1px}
.brand-tag{font-size:12px;color:var(--accent);background:rgba(199,91,57,.1);padding:2px 10px;border-radius:20px;border:1.5px dashed #e8815c;font-family:var(--font-sketch)}
.header-actions{display:flex;gap:6px}

.btn-sketch{background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius-rough-sm);padding:6px 14px;font-family:var(--font-sketch);font-size:14px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-rough-sm);transition:transform .1s,box-shadow .1s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-sketch:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0px rgba(61,50,43,.2)}
.btn-sketch:active{transform:translate(1px,1px);box-shadow:1px 1px 0px rgba(61,50,43,.1)}
.btn-sketch .icon{font-size:16px}
.btn-sketch.btn-sm{padding:4px 10px;font-size:12px}
.btn-sketch.btn-go{background:var(--accent);color:white;border-color:var(--accent)}

.side-panel{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:2000;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--radius-rough-lg);box-shadow:var(--shadow-rough);width:280px;max-height:65vh;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.side-panel.collapsed{transform:translateY(-50%) translateX(-320px)}
.panel-header{padding:12px 14px;border-bottom:2px dashed var(--ink-faint);flex-shrink:0}
.panel-header h3{font-family:var(--font-sketch);font-size:16px;font-weight:400;margin-bottom:10px}
.search-box{position:relative;margin-bottom:8px}
.search-box input{width:100%;padding:8px 32px 8px 12px;border:2px solid var(--ink-faint);border-radius:var(--radius-rough-sm);background:var(--paper-dark);font-family:var(--font-body);font-size:13px;color:var(--ink);outline:none}
.search-box input:focus{border-color:var(--ink)}
.search-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.category-filters{display:flex;flex-wrap:wrap;gap:4px}
.cat-chip{padding:3px 10px;border:1.5px solid var(--ink-faint);border-radius:20px;background:transparent;font-family:var(--font-sketch);font-size:12px;color:var(--ink-light);cursor:pointer;transition:all .15s}
.cat-chip:hover{border-color:var(--ink);color:var(--ink)}
.cat-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.location-list{overflow-y:auto;flex:1;padding:6px 8px}
.location-list::-webkit-scrollbar{width:6px}
.location-list::-webkit-scrollbar-track{background:transparent}
.location-list::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:3px}
.location-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-rough-sm);cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.location-item:hover{background:var(--paper-dark);border-color:var(--ink-faint)}
.location-item.active{background:rgba(74,124,150,.1);border-color:var(--blue)}
.location-item .loc-icon{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.location-item .loc-info{flex:1;min-width:0}
.location-item .loc-name{font-family:var(--font-sketch);font-size:14px;color:var(--ink)}
.location-item .loc-cat{font-size:11px;color:var(--ink-faint)}
.location-item .loc-nav-btn{flex-shrink:0;padding:4px 8px;border:1.5px solid var(--accent);border-radius:var(--radius-rough-sm);background:transparent;color:var(--accent);cursor:pointer;font-family:var(--font-sketch);font-size:11px;opacity:0;transition:opacity .15s}
.location-item:hover .loc-nav-btn{opacity:1}

.nav-info-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2000;background:var(--paper);border:2.5px solid var(--accent);border-radius:var(--radius-rough-lg);box-shadow:var(--shadow-rough);padding:10px 20px;display:none;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.nav-route-info{display:flex;align-items:center;gap:10px;font-family:var(--font-sketch);font-size:14px;flex-wrap:wrap;justify-content:center}
.nav-from,.nav-to{color:var(--ink)}
.nav-arrow{color:var(--accent);font-size:18px}
.nav-distance,.nav-time{background:rgba(199,91,57,.1);padding:3px 10px;border-radius:20px;font-size:12px;color:var(--accent)}

.agent-panel{position:fixed;right:16px;bottom:16px;z-index:2000;width:340px;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--radius-rough-lg);box-shadow:var(--shadow-rough);transition:all .3s;display:flex;flex-direction:column;max-height:480px}
.agent-panel.collapsed .agent-body{display:none}
.agent-panel.collapsed{max-height:none}
.agent-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;flex-shrink:0}
.agent-avatar{font-size:24px}
.agent-title{flex:1;font-family:var(--font-sketch);font-size:15px;color:var(--ink)}
.agent-toggle-icon{font-size:18px;color:var(--ink-faint);transition:transform .3s}
.agent-body{display:flex;flex-direction:column;flex:1;min-height:0;border-top:2px dashed var(--ink-faint)}
.chat-messages{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;max-height:240px}
.chat-messages::-webkit-scrollbar{width:5px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:3px}
.msg{display:flex;gap:8px;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.msg-bubble{max-width:75%;padding:8px 12px;border-radius:12px 4px 12px 12px;font-size:13px;line-height:1.6;border:1.5px solid var(--ink-faint);background:var(--paper-dark);color:var(--ink);font-family:var(--font-body)}
.msg.user .msg-bubble{background:rgba(74,124,150,.1);border-color:#6ba3bc;border-radius:4px 12px 12px 12px}
.quick-actions{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px;border-top:1px dashed var(--ink-faint)}
.quick-btn{padding:4px 10px;border:1.5px dashed var(--ink-faint);border-radius:20px;background:transparent;font-family:var(--font-sketch);font-size:11px;color:var(--ink-light);cursor:pointer;transition:all .15s}
.quick-btn:hover{border-color:var(--ink);background:var(--paper-dark);color:var(--ink)}
.chat-input-area{display:flex;gap:6px;padding:8px 12px;border-top:2px dashed var(--ink-faint)}
.chat-input-area input{flex:1;padding:8px 12px;border:2px solid var(--ink-faint);border-radius:var(--radius-rough-sm);background:var(--paper-dark);font-family:var(--font-body);font-size:13px;color:var(--ink);outline:none}
.chat-input-area input:focus{border-color:var(--ink)}
.btn-send{padding:8px 14px;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-rough-sm);font-family:var(--font-sketch);font-size:13px;cursor:pointer;transition:background .15s}
.btn-send:hover{background:var(--accent)}

.detail-popup{position:fixed;inset:0;z-index:5000;background:rgba(61,50,43,.3);display:none;align-items:center;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.popup-inner{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius-rough-lg);box-shadow:6px 6px 0px rgba(61,50,43,.2);padding:24px;text-align:center;max-width:320px;width:90%;position:relative;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.popup-close{position:absolute;top:8px;right:12px;background:none;border:none;font-size:20px;color:var(--ink-faint);cursor:pointer;padding:4px}
.popup-close:hover{color:var(--ink)}
.popup-icon{font-size:48px;margin-bottom:8px}
.popup-inner h3{font-family:var(--font-sketch);font-size:20px;font-weight:400;margin-bottom:6px}
.popup-desc{font-size:13px;color:var(--ink-light);margin-bottom:16px;line-height:1.5}
.popup-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.sketch-marker-wrap{display:flex;flex-direction:column;align-items:center}
.sketch-marker-wrap .marker-dot{width:14px;height:14px;background:var(--accent);border:2px solid var(--ink);border-radius:50%;box-shadow:2px 2px 0px rgba(61,50,43,.3)}
.sketch-marker-wrap .marker-label{font-family:var(--font-sketch);font-size:11px;color:var(--ink);background:var(--paper);padding:2px 8px;border:1.5px solid var(--ink);border-radius:var(--radius-rough-sm);white-space:nowrap;margin-top:2px;box-shadow:var(--shadow-rough-sm)}

.user-marker-wrap{display:flex;flex-direction:column;align-items:center}
.user-marker-wrap .user-dot-outer{width:24px;height:24px;background:rgba(74,124,150,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite}
.user-marker-wrap .user-dot-inner{width:12px;height:12px;background:var(--blue);border:2px solid white;border-radius:50%;box-shadow:0 0 8px rgba(74,124,150,.5)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}}

@media(max-width:768px){
  .side-panel{width:260px;left:6px;max-height:55vh}
  .agent-panel{width:calc(100vw - 24px);right:12px;bottom:8px;max-height:380px}
  .top-bar{padding:6px 12px;gap:8px}
  .brand h1{font-size:15px}
  .brand-tag{display:none}
  .nav-info-bar{bottom:70px;padding:8px 12px;gap:8px}
  .nav-route-info{font-size:12px}
}
@media(max-width:480px){
  .side-panel{width:240px;left:4px}
  .chat-messages{max-height:180px}
  .agent-panel{max-height:340px}
  .quick-actions{display:none}
  .nav-info-bar{bottom:80px}
}
</style>
</head>
<body>

<div id="map"></div>
<div class="coord-display" id="coordDisplay">移动鼠标查看坐标 | 右键采集</div>

<header class="top-bar">
  <div class="brand"><span class="brand-icon">🏛️</span><h1>河海大学江宁校区</h1><span class="brand-tag">手绘导航</span></div>
  <div class="header-actions">
    <button class="btn-sketch" id="btnPickStart"><span class="icon">📌</span> 选起点</button>
    <button class="btn-sketch" id="btnDemo" style="border-style:dashed;"><span class="icon">🎓</span> 模拟在校</button>
    <button class="btn-sketch" id="btnGps"><span class="icon">📍</span> 定位</button>
    <button class="btn-sketch" id="btnTogglePanel"><span class="icon">📋</span> 地点</button>
  </div>
</header>

<div class="side-panel" id="sidePanel">
  <div class="panel-header">
    <h3>🏫 校园重要场所</h3>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索地点…" autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>
    <div class="category-filters">
      <button class="cat-chip active" data-cat="all">全部</button>
      <button class="cat-chip" data-cat="teaching">📚 教学</button>
      <button class="cat-chip" data-cat="food">🍽️ 餐饮</button>
      <button class="cat-chip" data-cat="living">🏠 生活</button>
      <button class="cat-chip" data-cat="sports">⚽ 运动</button>
      <button class="cat-chip" data-cat="service">🏥 服务</button>
    </div>
  </div>
  <div class="location-list" id="locationList"></div>
</div>

<div class="nav-info-bar" id="navInfoBar">
  <div class="nav-route-info">
    <span id="navFrom">📍 起点</span><span class="nav-arrow">→</span><span id="navTo">🏁 目的地</span>
    <span class="nav-distance" id="navDistance"></span><span class="nav-time" id="navTime"></span>
  </div>
  <button class="btn-sketch btn-sm" id="btnCancelNav">✕ 取消</button>
</div>

<div class="agent-panel" id="agentPanel">
  <div class="agent-header" id="agentToggle">
    <span class="agent-avatar">🤖</span><span class="agent-title">校园导航助手</span><span class="agent-toggle-icon" id="agentToggleIcon">−</span>
  </div>
  <div class="agent-body" id="agentBody">
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot"><div class="msg-avatar">🤖</div><div class="msg-bubble">你好！我是河海大学江宁校区的导航助手 🎓<br>💡 点 <b>"📌 选起点"</b> 然后点地图设起点<br>或"🎓 模拟在校" / "📍 定位"<br>然后你可以问我："带我去图书馆"</div></div>
    </div>
    <div class="quick-actions">
      <button class="quick-btn" id="btnCalibrate" style="border-color:var(--accent);color:var(--accent);">🎯 校准定位</button>
      <button class="quick-btn" data-cmd="带我去图书馆">📖 去图书馆</button>
      <button class="quick-btn" data-cmd="带我去将军山餐厅">🍜 去餐厅</button>
      <button class="quick-btn" data-cmd="附近有什么">📍 附近</button>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="输入消息… 如：带我去图书馆" autocomplete="off">
      <button class="btn-send" id="btnSend">发送</button>
    </div>
  </div>
</div>

<div class="detail-popup" id="detailPopup">
  <div class="popup-inner">
    <button class="popup-close" id="popupClose">✕</button>
    <div class="popup-icon" id="popupIcon"></div><h3 id="popupName"></h3>
    <p class="popup-desc" id="popupDesc"></p>
    <div class="popup-actions"><button class="btn-sketch btn-go" id="popupGo">🧭 导航到这里</button></div>
  </div>
</div>

<script>
window._AMapSecurityConfig = { securityJsCode: '440045c6d58d125457011c85fa6daf53' };
</script>
<script src="https://webapi.amap.com/v2/maps?v=2.0&key=d44ef45508a81522c5ff3867f4d8d1f1&plugin=AMap.Walking,AMap.Geolocation,AMap.Scale"></script>
<script>
// ── 校园场所（18个实测点，GCJ-02，Amap原生坐标）───
var CAMPUS_LOCATIONS = [
  { id:'south-gate', name:'南门（正门）', category:'service', lng:118.785976, lat:31.911545, icon:'🚪', desc:'校区主入口·佛城西路' },
  { id:'west-gate', name:'西门', category:'service', lng:118.783058, lat:31.915245, icon:'🚪', desc:'西侧出口，商业街方向' },
  { id:'north-gate', name:'北门', category:'service', lng:118.787923, lat:31.917661, icon:'🚪', desc:'近体育区，往地铁站方向' },
  { id:'lib-south', name:'图书馆（南门）', category:'teaching', lng:118.785994, lat:31.913190, icon:'📚', desc:'标志性建筑正门入口' },
  { id:'lib-north', name:'图书馆（北门）', category:'teaching', lng:118.785929, lat:31.913937, icon:'📚', desc:'图书馆北侧入口' },
  { id:'zhigao-a', name:'致高楼A', category:'teaching', lng:118.786733, lat:31.915161, icon:'🏫', desc:'理论课教学楼' },
  { id:'zhigao-b', name:'致高楼B', category:'teaching', lng:118.787007, lat:31.915593, icon:'🏫', desc:'阶梯教室和报告厅' },
  { id:'zhiyong', name:'致用楼', category:'teaching', lng:118.785361, lat:31.914879, icon:'🔬', desc:'实验楼，机房和实验室' },
  { id:'cs-college', name:'计算机与信息学院', category:'teaching', lng:118.788106, lat:31.913281, icon:'💻', desc:'计算机学院办公楼' },
  { id:'ee-college', name:'电气院', category:'teaching', lng:118.787039, lat:31.913236, icon:'⚡', desc:'电气与动力工程学院' },
  { id:'sports-dept', name:'体育系', category:'teaching', lng:118.788498, lat:31.914710, icon:'🎯', desc:'体育系办公楼' },
  { id:'gym', name:'体育馆', category:'sports', lng:118.790348, lat:31.914314, icon:'🏟️', desc:'综合体育馆，内设健身房' },
  { id:'culture-center', name:'文体中心', category:'sports', lng:118.790444, lat:31.915470, icon:'🎭', desc:'文化体育活动中心' },
  { id:'jiangjunshan', name:'将军山餐厅', category:'food', lng:118.788277, lat:31.917341, icon:'🍽️', desc:'北部餐饮中心' },
  { id:'building24', name:'24号楼', category:'living', lng:118.789473, lat:31.916503, icon:'🏠', desc:'学生宿舍24号楼' },
  { id:'building25', name:'25号楼（25舍）', category:'living', lng:118.789505, lat:31.916958, icon:'🏠', desc:'学生宿舍25号楼' },
  { id:'hospital', name:'校医院', category:'service', lng:118.786900, lat:31.912904, icon:'🏥', desc:'24小时急诊，医保结算' },
  { id:'jingsi-bridge', name:'静思桥', category:'service', lng:118.787677, lat:31.914801, icon:'🌉', desc:'校园标志性小桥' }
];
var CATEGORY_META = { all:{name:'全部'}, teaching:{name:'教学'}, food:{name:'餐饮'}, living:{name:'生活'}, sports:{name:'运动'}, service:{name:'服务'} };

// ── 状态 ──────────────────────────────────────
var state = {
  userLng:null, userLat:null, userMarker:null, accuracyCircle:null, watchingId:null,
  markers:{}, activeCategory:'all', activeLocationId:null,
  isNavigating:false, navTarget:null, walking:null,
  calibLat:0, calibLng:0, isCalibrated:false,
  pickStartMode:false
};

// ── 地图 ──────────────────────────────────────
var map = new AMap.Map('map', {
  center:[118.7867,31.9146], zoom:16, minZoom:14, maxZoom:19,
  mapStyle:'amap://styles/normal', viewMode:'2D'
});

// 校区边界
new AMap.Polygon({
  path:[[118.7827,31.9112],[118.7910,31.9112],[118.7910,31.9180],[118.7827,31.9180]],
  strokeColor:'#c75b39', strokeWeight:3, strokeOpacity:0.7,
  fillColor:'#f0ead6', fillOpacity:0.25, strokeStyle:'dashed', strokeDasharray:[10,6]
}).setMap(map);

// ── 标记 ──────────────────────────────────────
function createSketchMarker(loc) {
  var m = new AMap.Marker({
    position:[loc.lng, loc.lat],
    content:'<div class="sketch-marker-wrap"><div class="marker-dot"></div><div class="marker-label">'+loc.icon+' '+loc.name+'</div></div>',
    offset:new AMap.Pixel(-60,-8), zIndex:100
  });
  m.on('click', function(){ showLocationDetail(loc); });
  m._locData = loc;
  return m;
}
function placeAllMarkers() {
  CAMPUS_LOCATIONS.forEach(function(loc) {
    var m = createSketchMarker(loc); m.setMap(map); state.markers[loc.id]=m;
  });
}

// ── 坐标 ──────────────────────────────────────
map.on('mousemove', function(e) {
  document.getElementById('coordDisplay').innerHTML = e.lnglat.lat.toFixed(6)+', '+e.lnglat.lng.toFixed(6)+' | 右键采集';
});

// 右键采集
var collectedCoords = [];
map.on('rightclick', function(e) {
  var lat = e.lnglat.lat.toFixed(6), lng = e.lnglat.lng.toFixed(6);
  var name = prompt('输入该地点名称：'); if (!name) return;
  collectedCoords.push({ name:name, lat:lat, lng:lng });
  var listHtml = collectedCoords.map(function(c,i){ return (i+1)+'. '+c.name+' — lng:'+c.lng+', lat:'+c.lat; }).join('<br>');
  addChatMessage('bot','✅ 已采集 <b>'+name+'</b><br><code style="font-size:10px;">lng:'+lng+', lat:'+lat+'</code><br><br>📋 <b>已采集 '+collectedCoords.length+' 个：</b><br>'+listHtml+'<br><button onclick="copyCollected()" style="padding:4px 12px;border:1.5px solid var(--ink);border-radius:20px;background:var(--paper-dark);cursor:pointer;font-size:12px;">📋 一键复制</button><button onclick="clearCollected()" style="padding:4px 12px;border:1.5px solid var(--ink);border-radius:20px;background:var(--paper-dark);cursor:pointer;font-size:12px;margin-left:4px;">🗑️ 清空</button>');
});
function copyCollected(){ var t=collectedCoords.map(function(c){return c.name+'：'+c.lat+', '+c.lng;}).join('\n'); navigator.clipboard.writeText(t).then(function(){addChatMessage('bot','📋 已复制！');}); }
function clearCollected(){ collectedCoords=[]; addChatMessage('bot','🗑️ 已清空。'); }

// ── 起点 ──────────────────────────────────────
var btnPickStart = document.getElementById('btnPickStart');
btnPickStart.addEventListener('click', function() {
  state.pickStartMode = !state.pickStartMode;
  if (state.pickStartMode) {
    btnPickStart.style.background='var(--accent)'; btnPickStart.style.color='white';
    map.getContainer().style.cursor='crosshair'; addChatMessage('bot','📌 请点击地图上任意位置设置起点');
  } else {
    btnPickStart.style.background=''; btnPickStart.style.color=''; map.getContainer().style.cursor='';
  }
});
map.on('click', function(e) {
  if (!state.pickStartMode) return;
  setUserPos(e.lnglat.lng, e.lnglat.lat);
  state.pickStartMode=false; btnPickStart.style.background=''; btnPickStart.style.color=''; map.getContainer().style.cursor='';
  addChatMessage('bot','📍 起点已设置（'+state.userLat.toFixed(6)+', '+state.userLng.toFixed(6)+'）');
});

// ── 定位 ──────────────────────────────────────
function setUserPos(lng, lat) {
  if (state.userMarker) { state.userMarker.setMap(null); }
  if (state.accuracyCircle) { state.accuracyCircle.setMap(null); }
  state.userLng=lng; state.userLat=lat;
  state.userMarker = new AMap.Marker({
    position:[lng,lat],
    content:'<div class="user-marker-wrap"><div class="user-dot-outer"><div class="user-dot-inner"></div></div></div>',
    offset:new AMap.Pixel(-15,-15), zIndex:1000
  });
  state.userMarker.setMap(map);
  state.accuracyCircle = new AMap.Circle({
    center:[lng,lat], radius:5,
    strokeColor:'#4a7c96', strokeWeight:1, strokeOpacity:0.5,
    fillColor:'#4a7c96', fillOpacity:0.15, strokeStyle:'dashed', strokeDasharray:[3,4]
  });
  state.accuracyCircle.setMap(map);
  map.setCenter([lng,lat]);
}

document.getElementById('btnDemo').addEventListener('click', function() {
  if (state.watchingId!==null) { navigator.geolocation.clearWatch(state.watchingId); state.watchingId=null; }
  setUserPos(118.78935, 31.91680);
  map.setZoom(17); addChatMessage('bot','🎓 已模拟定位至25舍附近。');
});

var smoothState = { lat:null, lng:null, acc:999, count:0 };

document.getElementById('btnGps').addEventListener('click', function() {
  if (!navigator.geolocation) { addChatMessage('bot','⚠️ 浏览器不支持定位。'); return; }
  if (state.watchingId!==null) {
    if (state.userLat) { map.setCenter([state.userLng, state.userLat]); addChatMessage('bot','📍 已移至当前位置。'); }
    return;
  }
  smoothState = { lat:null, lng:null, acc:999, count:0 };
  state.watchingId = navigator.geolocation.watchPosition(function(pos) {
    var lng=pos.coords.longitude, lat=pos.coords.latitude, acc=pos.coords.accuracy;
    if (smoothState.lat===null) { smoothState.lat=lat; smoothState.lng=lng; smoothState.acc=acc; smoothState.count=1; }
    else {
      if (acc>100 && smoothState.acc<50) return;
      var alpha = Math.max(0.3, Math.min(0.8, 1-acc/100));
      smoothState.lat = alpha*lat + (1-alpha)*smoothState.lat;
      smoothState.lng = alpha*lng + (1-alpha)*smoothState.lng;
      smoothState.acc=acc; smoothState.count++;
    }
    var clng = smoothState.lng + (state.isCalibrated?state.calibLng:0);
    var clat = smoothState.lat + (state.isCalibrated?state.calibLat:0);
    if (!state.userMarker) {
      setUserPos(clng, clat); map.setZoom(18);
      var s=acc<10?'精度极高':acc<30?'精度良好':acc<100?'精度一般':'精度较低';
      addChatMessage('bot','✅ 已定位（'+s+'，误差~'+Math.round(acc)+'米）<br>持续收集中…');
    } else {
      state.userLng=clng; state.userLat=clat;
      state.userMarker.setPosition([clng, clat]);
      state.accuracyCircle.setCenter([clng, clat]);
      state.accuracyCircle.setRadius(Math.max(5, acc));
      if (smoothState.count%20===0) addChatMessage('bot','📍 误差~'+Math.round(acc)+'米（已收集'+smoothState.count+'点）');
    }
  }, function(err) {
    var m='⚠️ '; switch(err.code){case 1:m+='权限被拒';break;case 2:m+='无法获取位置';break;case 3:m+='超时';break;default:m+='失败';}
    addChatMessage('bot',m);
  }, { enableHighAccuracy:true, maximumAge:1000, timeout:60000 });
});

// ── 校准 ──────────────────────────────────────
document.getElementById('btnCalibrate').addEventListener('click', function() {
  if (!state.userLat) { addChatMessage('bot','⚠️ 请先定位。'); return; }
  var names = CAMPUS_LOCATIONS.map(function(l,i){ return (i+1)+'. '+l.name; }).join('\n');
  var choice = prompt('你当前站在哪个地点？输入编号或名称：\n\n'+names);
  if (!choice) return;
  var loc=null, num=parseInt(choice);
  if (num>=1&&num<=CAMPUS_LOCATIONS.length) loc=CAMPUS_LOCATIONS[num-1];
  else loc=CAMPUS_LOCATIONS.find(function(l){return l.name.indexOf(choice)>-1||choice.indexOf(l.name)>-1;});
  if (!loc) { addChatMessage('bot','⚠️ 未找到匹配地点。'); return; }
  state.calibLng = loc.lng - state.userLng;
  state.calibLat = loc.lat - state.userLat;
  state.isCalibrated = true;
  state.userLng += state.calibLng; state.userLat += state.calibLat;
  if (state.userMarker) { state.userMarker.setPosition([state.userLng, state.userLat]); state.accuracyCircle.setCenter([state.userLng, state.userLat]); }
  map.setCenter([state.userLng, state.userLat]); map.setZoom(18);
  addChatMessage('bot','🎯 已校准至 <b>'+loc.name+'</b>');
});

// ── 高德步行导航（原生SDK，路线天然对齐）─────
function navigateTo(loc) {
  if (!state.userLat) { addChatMessage('bot','⚠️ 请先设置起点！'); return; }
  clearRoute();
  addChatMessage('bot','🔍 高德正在规划步行路线…');

  if (!state.walking) { state.walking = new AMap.Walking({ map:map, hideMarkers:false }); }

  state.walking.search([state.userLng, state.userLat], [loc.lng, loc.lat], function(status, result) {
    if (status==='complete' && result.routes && result.routes.length>0) {
      var route=result.routes[0], dist=0, duration=0, stepsHtml='';
      if (route.steps) {
        route.steps.forEach(function(s){ dist+=s.distance||0; duration+=s.time||0; });
        var ss=route.steps.slice(0,6);
        stepsHtml='<br>📋 路线指引：<br>';
        ss.forEach(function(s,i){ var rd=s.road?' (<em>'+s.road+'</em>)':''; stepsHtml+=(i+1)+'. 🚶 '+s.instruction+rd+' — '+(s.distance||0)+'米<br>'; });
        if (route.steps.length>6) stepsHtml+='…共'+route.steps.length+'步<br>';
      }
      state.isNavigating=true; state.navTarget=loc;
      document.getElementById('navFrom').textContent='📍 起点';
      document.getElementById('navTo').textContent=loc.icon+' '+loc.name;
      var ds=dist<1000?dist+'米':(dist/1000).toFixed(1)+'公里';
      document.getElementById('navDistance').textContent='📏 '+ds;
      var wm=Math.ceil(duration/60);
      var ts=wm<1?'不到1分钟':wm<60?'约'+wm+'分钟':'约'+Math.floor(wm/60)+'小时'+(wm%60)+'分钟';
      document.getElementById('navTime').textContent='🚶 '+ts;
      document.getElementById('navInfoBar').style.display='flex';
      addChatMessage('bot',['✅ 路线已规划至 <strong>'+loc.name+'</strong>','📏 '+ds,'🚶 '+ts,'🛣️ 沿蓝色路线行走',stepsHtml].join('<br>'));
      highlightLocation(loc.id);
      map.setFitView();
    } else {
      addChatMessage('bot','⚠️ 路线规划失败（'+status+'），试试其他目的地。');
    }
  });
}

function clearRoute() {
  if (state.walking) { state.walking.clear(); }
  state.isNavigating=false; state.navTarget=null;
  document.getElementById('navInfoBar').style.display='none'; clearHighlight();
}

// ── 地点UI ────────────────────────────────────
function highlightLocation(id) {
  clearHighlight(); state.activeLocationId=id;
  var el=document.querySelector('[data-loc-id="'+id+'"]');
  if (el) { el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function clearHighlight(){ state.activeLocationId=null; var items=document.querySelectorAll('.location-item.active'); for(var i=0;i<items.length;i++)items[i].classList.remove('active'); }
function showLocationDetail(loc){ document.getElementById('popupIcon').textContent=loc.icon; document.getElementById('popupName').textContent=loc.name; document.getElementById('popupDesc').textContent=loc.desc; document.getElementById('detailPopup').style.display='flex'; document.getElementById('popupGo').onclick=function(){closeDetailPopup();navigateTo(loc);}; }
function closeDetailPopup(){ document.getElementById('detailPopup').style.display='none'; }

function renderLocationList(filter, search) {
  filter=filter||'all'; search=search||'';
  var list=document.getElementById('locationList'), filtered=CAMPUS_LOCATIONS;
  if (filter!=='all') filtered=filtered.filter(function(l){return l.category===filter;});
  if (search) { var q=search.toLowerCase(); filtered=filtered.filter(function(l){return l.name.toLowerCase().indexOf(q)>-1||l.desc.toLowerCase().indexOf(q)>-1;}); }
  if (filtered.length===0) { list.innerHTML='<div style="text-align:center;padding:20px;color:#a89880;">没有找到匹配的地点 🧐</div>'; return; }
  list.innerHTML=filtered.map(function(loc){
    return '<div class="location-item" data-loc-id="'+loc.id+'" onclick="handleLocationClick(\''+loc.id+'\')">'+
      '<span class="loc-icon">'+loc.icon+'</span><div class="loc-info"><div class="loc-name">'+loc.name+'</div><div class="loc-cat">'+CATEGORY_META[loc.category].name+'</div></div>'+
      '<button class="loc-nav-btn" onclick="event.stopPropagation();handleNavClick(\''+loc.id+'\')">🧭 导航</button></div>';
  }).join('');
  if (state.activeLocationId) { var el=document.querySelector('[data-loc-id="'+state.activeLocationId+'"]'); if (el) el.classList.add('active'); }
}
function handleLocationClick(id){ var loc=CAMPUS_LOCATIONS.find(function(l){return l.id===id;}); if (!loc) return; map.setCenter([loc.lng,loc.lat]); map.setZoom(18); highlightLocation(id); }
function handleNavClick(id){ var loc=CAMPUS_LOCATIONS.find(function(l){return l.id===id;}); if (!loc) return; navigateTo(loc); }

// ── AI助手 ────────────────────────────────────
function addChatMessage(role, text) {
  var c=document.getElementById('chatMessages'), d=document.createElement('div');
  d.className='msg '+role; d.innerHTML='<span class="msg-avatar">'+(role==='bot'?'🤖':'🧑')+'</span><div class="msg-bubble">'+text+'</div>';
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function haversine(lat1,lng1,lat2,lng2){var R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function bearing(lat1,lng1,lat2,lng2){var dLng=(lng2-lng1)*Math.PI/180,y=Math.sin(dLng)*Math.cos(lat2*Math.PI/180),x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLng);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function b2d(b){var d=['北','东北','东','东南','南','西南','西','西北'];return d[Math.round(b/45)%8];}

function findLocation(name){
  var clean=name.replace(/[的地点了吗在哪里去带我怎么走到达导航至]/g,'').trim();
  var f=CAMPUS_LOCATIONS.find(function(l){return l.name===clean;});
  if (f) return f;
  f=CAMPUS_LOCATIONS.find(function(l){return l.name.indexOf(clean)>-1||clean.indexOf(l.name.replace(/[区东西南北（）\(\)]/g,''))>-1;});
  if (f) return f;
  for(var i=0;i<CAMPUS_LOCATIONS.length;i++){var sn=CAMPUS_LOCATIONS[i].name.replace(/（.*）|\(.*\)|校区|江宁|学生/g,'');if(clean.indexOf(sn.substring(0,2))>-1||sn.indexOf(clean.substring(0,2))>-1)return CAMPUS_LOCATIONS[i];}
  return null;
}

function processAgentQuery(input){
  var q=input.trim(); if (!q) return;
  addChatMessage('user',q);
  var isNav=/带我去|导航到|怎么去|怎么走|去往|到达|走到/.test(q);
  var isWhere=/在哪里|在哪|位置|什么地方|怎么找/.test(q);
  var isNearby=/附近|周边|最近|近一点|旁边的/.test(q);
  var tl=null;

  if (isNav||isWhere) { tl=findLocation(q); if (tl&&isNav){navigateTo(tl);return;} if (tl&&isWhere){map.setCenter([tl.lng,tl.lat]);map.setZoom(18);highlightLocation(tl.id);addChatMessage('bot','📍 <strong>'+tl.name+'</strong><br>'+tl.desc);return;} }

  if (q.indexOf('图书馆')>-1) tl=CAMPUS_LOCATIONS.find(function(l){return l.id==='lib-south';});
  else if (q.indexOf('体育馆')>-1) tl=CAMPUS_LOCATIONS.find(function(l){return l.id==='gym';});
  else if (q.indexOf('餐厅')>-1||q.indexOf('食堂')>-1||q.indexOf('吃')>-1) tl=CAMPUS_LOCATIONS.find(function(l){return l.id==='jiangjunshan';});
  else if (q.indexOf('校医院')>-1) tl=CAMPUS_LOCATIONS.find(function(l){return l.id==='hospital';});

  if (tl&&isNav){navigateTo(tl);return;}
  if (tl){map.setCenter([tl.lng,tl.lat]);map.setZoom(18);highlightLocation(tl.id);addChatMessage('bot','📍 <strong>'+tl.name+'</strong><br>'+tl.desc);showLocationDetail(tl);return;}

  if (isNearby){
    if (!state.userLat){addChatMessage('bot','⚠️ 请先设置起点！');return;}
    var nearby=CAMPUS_LOCATIONS.map(function(l){return Object.assign({},l,{distance:haversine(state.userLat,state.userLng,l.lat,l.lng)});}).sort(function(a,b){return a.distance-b.distance;}).slice(0,5);
    var lines=nearby.map(function(l,i){var d=l.distance<1000?Math.round(l.distance)+'米':(l.distance/1000).toFixed(1)+'公里';return (i+1)+'. '+l.icon+' <strong>'+l.name+'</strong> — '+b2d(bearing(state.userLat,state.userLng,l.lat,l.lng))+' '+d;});
    addChatMessage('bot','📍 最近的场所：<br><br>'+lines.join('<br>')+'<br><br>💡 说"带我去XX"开始导航');return;
  }
  addChatMessage('bot','你可以这样问我：<br>• "带我去图书馆"<br>• "体育馆在哪里"<br>• "附近有什么"');
}

document.getElementById('btnTogglePanel').addEventListener('click',function(){document.getElementById('sidePanel').classList.toggle('collapsed');});
document.getElementById('btnCancelNav').addEventListener('click',function(){clearRoute();addChatMessage('bot','🛑 已取消导航。');});
document.getElementById('btnSend').addEventListener('click',function(){var i=document.getElementById('chatInput');processAgentQuery(i.value);i.value='';});
document.getElementById('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'){var i=document.getElementById('chatInput');processAgentQuery(i.value);i.value='';}});

var chips=document.querySelectorAll('.cat-chip');
for(var i=0;i<chips.length;i++){chips[i].addEventListener('click',function(){for(var j=0;j<chips.length;j++)chips[j].classList.remove('active');this.classList.add('active');state.activeCategory=this.dataset.cat;document.getElementById('searchInput').value='';renderLocationList(state.activeCategory);CAMPUS_LOCATIONS.forEach(function(loc){var m=state.markers[loc.id];if(m){state.activeCategory==='all'||loc.category===state.activeCategory?m.show():m.hide();}});});}
var qbs=document.querySelectorAll('.quick-btn');
for(var k=0;k<qbs.length;k++){qbs[k].addEventListener('click',function(){processAgentQuery(this.dataset.cmd);});}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDetailPopup();clearRoute();}});

function init(){placeAllMarkers();renderLocationList();}
init();
